plugins { id 'com.android.application'; id 'com.google.gms.google-services' }
android {
    namespace 'com.hewers.workforce'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig { applicationId 'com.hewers.workforce'; minSdk 26; targetSdk 36; versionCode 3; versionName '0.3.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.14.0'; implementation 'androidx.activity:activity:1.11.0'; testImplementation 'junit:junit:4.13.2'; androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test.ext:junit:1.2.1'; androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0' }
dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-messaging'
}
