plugins { id 'com.android.application' }
android {
    namespace 'com.hewers.workforce'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig { applicationId 'com.hewers.workforce'; minSdk 26; targetSdk 36; versionCode 1; versionName '0.1.0' }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.14.0'; testImplementation 'junit:junit:4.13.2' }
